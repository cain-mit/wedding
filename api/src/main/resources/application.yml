spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.50.5}:${DB_PORT:5432}/${DB_NAME:wedding}
    username: ${DB_USER:wedding_app}
    password: ${DB_PASSWORD:wedding_app_123}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
    open-in-view: false
  jackson:
    time-zone: UTC
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
